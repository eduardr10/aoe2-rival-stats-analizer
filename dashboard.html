<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AoE2 Dashboard</title>
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <header class="dashboard-header">
    <div class="header-inner">
      <div class="player-avatar" id="header-avatar">?</div>
      <div class="player-info">
        <div class="player-name" id="header-name">Cargando...</div>
        <div class="player-meta" id="header-meta">—</div>
      </div>
      <div class="wr-badge" id="header-wr">—</div>
    </div>
  </header>

  <main class="dashboard-main">
    <!-- Live match banner -->
    <div class="live-match-banner" id="live-match-banner">
      <div class="live-match-banner-info">
        <div class="live-match-title">Partida en curso</div>
        <div class="live-match-vs" id="live-match-vs">vs ...</div>
      </div>
      <div class="live-match-actions">
        <button class="btn-analyze-rival" id="btn-analyze-rival">Analizar Rival</button>
        <a class="btn-rival-profile" id="btn-rival-profile" href="#" target="_blank">Ver perfil ↗</a>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls-bar" id="controls-bar">
      <div class="control-group">
        <label for="ctrl-ladder">Ladder</label>
        <select id="ctrl-ladder">
          <option value="">Ambos</option>
          <option value="rm_1v1">Ranked 1v1</option>
          <option value="unranked">Unranked</option>
        </select>
      </div>
      <div class="control-group">
        <label for="ctrl-date-from">Desde</label>
        <input type="date" id="ctrl-date-from" />
      </div>
      <div class="control-group">
        <label for="ctrl-date-to">Hasta</label>
        <input type="date" id="ctrl-date-to" />
      </div>
      <button class="btn-apply" id="btn-apply">Aplicar</button>
    </div>

    <!-- Comparative section (appears when live match detected) -->
    <div id="comparative"></div>

    <!-- Main dashboard content -->
    <div id="dashboard">
      <div class="loading-state">
        <div class="loading-spinner"></div>
        Cargando perfil...
      </div>
    </div>
  </main>

  <footer class="dashboard-footer">
    AoE2 Rival Stats Analyzer · Datos de AoE2 Companion
  </footer>

  <script type="module">
    import { initDashboard } from './js/dashboard.js';
    document.addEventListener('DOMContentLoaded', initDashboard);
  </script>
</body>
</html>
